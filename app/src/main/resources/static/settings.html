<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Business Manager | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="index.html" class="logo">Business Manager</a>

        <nav class="nav">
            <a href="index.html" class="nav-link" title="Home">
                <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
                Home
            </a>
            <a href="products.html" class="nav-link" title="Products">
                <svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 11v10"/></svg>
                Products
            </a>
            <a href="sales.html" class="nav-link" title="Sales">
                <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>
                Sales
            </a>
            <a href="summary.html" class="nav-link" title="Summary">
                <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                Summary
            </a>
            <a href="database.html" class="nav-link" title="Database">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></svg>
                Database
            </a>
        </nav>

        <!-- Bottom Navigation -->
        <nav class="nav nav-bottom">
            <button type="button" class="nav-link" title="Tutorial">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
                Tutorial
            </button>
            <a href="settings.html" class="nav-link active" title="Settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                Settings
            </a>
        </nav>

        <!-- Business Switcher -->
        <details class="business" name="dropdown">
            <summary>
                <span class="avatar">B</span>
                <span class="business-name">
                    <strong>Business</strong>
                    <small>Switch business</small>
                </span>
            </summary>
            <div class="menu">
                <button type="button" class="selected"><span class="avatar">B</span>Business</button>
                <button type="button"><span class="avatar">B</span>Business 2</button>
                <a href="index.html" class="add-business">+ New business</a>
            </div>
        </details>
    </aside>

    <main class="main">
        <!-- Page Title -->
        <header class="page-header">
            <h1>Settings</h1>
        </header>
    </main>
</div>

<!-- Notifications -->
<div class="notifications" role="status"></div>

<!-- Templates -->

<!-- Regular product -->
<template id="template-product">
    <li class="product">
        <div class="row">
            <span class="thumb"></span>
            <span class="name"></span>
            <span class="stock"></span>
            <span class="price"></span>
            <div class="tags"></div>

            <div class="actions">
                <button type="button" class="btn btn-dark btn-sale" popovertarget="panel-register-sale">Register sale</button>
                <button type="button" class="btn btn-view" popovertarget="panel-product">View</button>
                <details class="dropdown" name="dropdown">
                    <summary class="dots"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></summary>
                    <div class="menu">
                        <button type="button">Duplicate</button>
                        <button type="button" popovertarget="panel-product">Add subproduct</button>
                        <button type="button">Archive</button>
                        <button type="button" class="delete">Delete</button>
                    </div>
                </details>
            </div>
        </div>
    </li>
</template>

<!-- Product with subproducts (no price or register sale button) -->
<template id="template-product-group">
    <li class="product product-group">
        <div class="row">
            <span class="thumb"></span>
            <span class="name"></span>
            <span class="stock"></span>
            <span class="price"></span>
            <div class="tags"></div>

            <div class="actions">
                <span class="btn-sale"></span>
                <button type="button" class="btn btn-view" popovertarget="panel-product">View</button>
                <details class="dropdown" name="dropdown">
                    <summary class="dots"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></summary>
                    <div class="menu">
                        <button type="button">Duplicate</button>
                        <button type="button" popovertarget="panel-product">Add subproduct</button>
                        <button type="button">Archive</button>
                        <button type="button" class="delete">Delete</button>
                    </div>
                </details>
            </div>
        </div>
        <ul class="subproducts"></ul>
    </li>
</template>

<!-- Subproduct (goes inside .subproducts) -->
<template id="template-subproduct">
    <li class="product">
        <div class="row row-sub">
            <span class="thumb"></span>
            <span class="name"></span>
            <span class="stock"></span>
            <span class="price"></span>
            <div class="tags"></div>

            <div class="actions">
                <button type="button" class="btn btn-dark btn-sale" popovertarget="panel-register-sale">Register sale</button>
                <button type="button" class="btn btn-view" popovertarget="panel-product">View</button>
                <details class="dropdown" name="dropdown">
                    <summary class="dots"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></summary>
                    <div class="menu">
                        <button type="button">Duplicate</button>
                        <button type="button">Archive</button>
                        <button type="button" class="delete">Delete</button>
                    </div>
                </details>
            </div>
        </div>
    </li>
</template>

<!-- One tag (goes inside .tags or .tag-menu for extra tags) -->
<template id="template-tag">
    <span class="tag"></span>
</template>

<!-- Plus button to see extra tags (goes inside .tags at the end) -->
<template id="template-tag-more">
    <details class="dropdown" name="dropdown">
        <summary class="tag tag-more"></summary>
        <div class="menu tag-menu"></div>
    </details>
</template>

<!-- One tag to sort by (goes inside .tag-sort-list in the sort dropdown) -->
<template id="template-tag-sort">
    <button type="button"></button>
</template>

<!-- One notification (goes inside .notifications) -->
<template id="template-notification">
    <div class="notification">
        <span class="notification-icon"><svg viewBox="0 0 24 24"><path d="M12 6v7M12 18v.01"/></svg></span>
        <span class="notification-message"></span>
        <button type="button" class="close-btn" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
</template>

<!-- One parent product to pick in the subproduct dropdown in the product panel (goes inside .parent-list) -->
<template id="template-parent-option">
    <button type="button"></button>
</template>

<!-- One chosen tag in the product panel (goes inside .tag-field, before .add-tag) -->
<template id="template-tag-chosen">
    <span class="tag tag-chosen"><span class="tag-name"></span><button type="button" class="tag-remove" title="Remove tag"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
</template>

<!-- One existing tag to pick in the tag dropdown in the product panel (goes inside .tag-option-list). Add a color class to .tag-dot -->
<template id="template-tag-option">
    <button type="button"><span class="tag-dot"></span><span class="tag-name"></span></button>
</template>

<!-- One component row in the product panel (goes inside .component-list) -->
<template id="template-component">
    <li class="component">
        <input type="text" class="input" placeholder="Component name">
        <label class="input input-money"><span>$</span><input type="number" min="0" step="0.01" placeholder="0.00"></label>
        <button type="button" class="close-btn" title="Remove component"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </li>
</template>

<script src="js/product-form.js" defer></script>
<script src="js/product-list.js" defer></script>
</body>
</html>
