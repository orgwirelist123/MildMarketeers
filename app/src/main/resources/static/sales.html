<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Business Manager | Sales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sales.css">
</head>
<script src="js/sales-list.js" defer></script>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="index.html" class="logo">Business Manager</a>

        <nav class="nav">
            <a href="index.html" class="nav-link" title="Home">
                <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
                Home
            </a>
            <a href="products.html" class="nav-link" title="Products">
                <svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 11v10"/></svg>
                Products
            </a>
            <a href="sales.html" class="nav-link active" title="Sales">
                <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>
                Sales
            </a>
            <a href="summary.html" class="nav-link" title="Summary">
                <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                Summary
            </a>
            <a href="database.html" class="nav-link" title="Database">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></svg>
                Database
            </a>
        </nav>

        <!-- Bottom Navigation -->
        <nav class="nav nav-bottom">
            <button type="button" class="nav-link" title="Tutorial">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
                Tutorial
            </button>
            <a href="settings.html" class="nav-link" title="Settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                Settings
            </a>
        </nav>

        <!-- Business Switcher -->
        <details class="business" name="dropdown">
            <summary>
                <span class="avatar">B</span>
                <span class="business-name">
                    <strong>Business</strong>
                    <small>Switch business</small>
                </span>
            </summary>
            <div class="menu">
                <button type="button" class="selected"><span class="avatar">B</span>Business</button>
                <button type="button"><span class="avatar">B</span>Business 2</button>
                <a href="index.html" class="add-business">+ New business</a>
            </div>
        </details>
    </aside>

    <main class="main">
        <!-- Page Title -->
        <header class="page-header">
            <h1>Sales</h1>
            <div class="header-actions">
                <button type="button" class="btn refresh-icon" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
            </div>
        </header>

        <!-- Search and Sort -->
        <div class="toolbar">
            <div class="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" placeholder="Search sales...">
            </div>

            <details class="dropdown" name="dropdown">
                <summary class="btn">
                    Sort: Newest
                    <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
                </summary>
                <div class="menu">
                    <button type="button" class="selected">Newest</button>
                    <button type="button">Oldest</button>
                    <button type="button">Highest total</button>
                    <button type="button">Lowest total</button>
                </div>
            </details>
        </div>

        <!-- Column Labels -->
        <div class="sales-header">
            <span>Sale ID</span>
            <span>Date</span>
            <span>Product</span>
            <span class="sales-total">Total</span>
        </div>

        <!-- Example Sales (template is at the bottom of the page) -->
        <ul class="sales-list">
            <li class="sales-row">
                <span class="sales-id">#1000</span>
                <span class="sales-date">Nov 3, 2026</span>
                <span class="sales-product"><span class="sales-product-name">Holographic sticker</span><span class="sales-quantity">× 3</span></span>
                <span class="sales-total">$100.00</span>
            </li>

            <li class="sales-row">
                <span class="sales-id">#1000</span>
                <span class="sales-date">Nov 3, 2026</span>
                <span class="sales-product"><span class="sales-product-name">Keychain</span><span class="sales-quantity">× 3</span></span>
                <span class="sales-total">$100.00</span>
            </li>

            <li class="sales-row">
                <span class="sales-id">#1000</span>
                <span class="sales-date">Nov 3, 2026</span>
                <span class="sales-product"><span class="sales-product-name">Luggage tag</span><span class="sales-quantity">× 3</span></span>
                <span class="sales-total">$100.00</span>
            </li>
        </ul>
    </main>
</div>

<!-- Notifications -->
<div class="notifications" role="status"></div>

<!-- Templates -->

<!-- One sale (goes inside .sales-list) -->
<template id="template-sale">
    <li class="sales-row">
        <span class="sales-id"></span>
        <span class="sales-date"></span>
        <span class="sales-product"><span class="sales-product-name"></span><span class="sales-quantity"></span></span>
        <span class="sales-total"></span>
    </li>
</template>

<!-- One notification (goes inside .notifications) -->
<template id="template-notification">
    <div class="notification">
        <span class="notification-icon"><svg viewBox="0 0 24 24"><path d="M12 6v7M12 18v.01"/></svg></span>
        <span class="notification-message"></span>
        <button type="button" class="close-btn" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
</template>

</body>
</html>
